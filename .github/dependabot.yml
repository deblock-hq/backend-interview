# Dependabot config — managed by the supply-chain rollout.
# Each ecosystem block opens a weekly PR; security team reviews them.
# See: deblock-hq/security-policy

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - gradle
    reviewers:
      - deblock-hq/security
